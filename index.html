  <script id="site-data" type="application/json">{"profile":{"name":"Williamtym","siteTitle":"Williamtym · 探索手记","description":"计算机科学与技术硕士研究生。记录技术实践、算法思考与历史阅读，在探索中慢慢积累。","role":"计算机科学与技术 · 硕士研究生","motto":"保持好奇，认真求证。","socials":[{"name":"GitHub","label":"代码与项目","url":"https://github.com/williamtymhuabian","symbol":"github"},{"name":"CSDN","label":"技术文章","url":"https://blog.csdn.net/Williamtym","symbol":"code"},{"name":"小红书","label":"待添加主页","url":"","symbol":"book"},{"name":"抖音","label":"待添加主页","url":"","symbol":"video"},{"name":"视频号","label":"待添加主页","url":"","symbol":"play"}],"awards":[{"year":"2025","title":"ICPC 全国邀请赛 · 南昌站","prize":"银奖","category":"算法竞赛","detail":"2025 ICPC China National Invitational Programming Contest (Nanchang)，团队 Night Without Dawn，Silver Medal。已核对所提供的团队证书。"},{"year":"2025","title":"第十六届蓝桥杯全国总决赛","prize":"二等奖","category":"程序设计","detail":"C/C++ 程序设计大学 B 组，全国总决赛二等奖。已核对所提供的个人获奖证书。"},{"year":"2025","title":"中国大学生计算机设计大赛","prize":"全国二等奖","category":"团队作品","detail":"第 18 届中国大学生计算机设计大赛，团队作品《汲古澄源 碧境新生——海洋水体富营养化修复系统》，数媒静态设计—产品设计专业组，二等奖。已核对所提供的团队证书。"},{"year":"2024","title":"全国大学生数学建模竞赛","prize":"湖北赛区一等奖","category":"数学建模","detail":"2024 年全国大学生数学建模竞赛，湖北赛区一等奖。已核对所提供的团队证书。"}]},"posts":[{"slug":"first-push","title":"从本地到 GitHub：第一次推送个人网站","date":"2026-10-16","category":"建站手记","summary":"从一次本地提交开始，把个人网站放进 GitHub，再用 GitHub Pages 让它拥有自己的网址。","tags":["Git","GitHub","个人网站"],"pinned":true,"readTime":5,"searchText":"\nGit 负责记录本地版本，GitHub 用来保存远程仓库，GitHub Pages 则负责把仓库中的网页发布出来。完成一次发布，需要依次走过这三个环节。\n\n这是一篇随网站附带的入门手记。仓库名、邮箱等示例需要替换成自己的信息；下面的命令没有自动执行。\n\n 先在本地生成网页\n\n打开 PowerShell，进入这个项目文件夹，生成网页：\n\npowershell\nSet-Location -LiteralPath 'C:\\Users\\ASUS\\Desktop\\自媒体\\personal-site'\nnode build.mjs\n\n\n生成后的 index.html 可以直接双击打开。需要本地预览地址时，执行 node build.mjs --serve，再访问终端打印的地址。\n\n 建立本地版本记录\n\n确认当前目录就是 personal-site。对于这个尚未初始化的新项目，依次执行：\n\npowershell\ngit init -b main\ngit config user.name \"Williamtym\"\ngit config user.email \"替换成你的 GitHub 提交邮箱\"\ngit status\ngit add .\ngit commit -m \"Create personal website\"\n\n\n邮箱可以在 GitHub 的 Settings → Emails 中查看，也可以使用那里提供的 noreply 邮箱。这里的 git config 只设置当前仓库。\n\ngit add 选择准备记录的修改，git commit 在本地保存一次版本。完成 commit 后，文件仍然只在本地。\n\n 连接 GitHub 仓库并推送\n\n在 GitHub 创建一个名为 personal-site 的空仓库。不要勾选自动添加 README、.gitignore 或 License，因为本地已经有文件。\n\n然后连接远程仓库，并推送 main 分支：\n\npowershell\ngit remote add origin https://github.com/williamtymhuabian/personal-site.git\ngit remote -v\ngit push -u origin main\n\n\n这里的远程地址以仓库名 personal-site 为例；如果使用其他名字，请换成新仓库页面显示的 HTTPS 地址。第一次连接时按 Git 的登录提示完成授权。GitHub 账号密码不能作为 HTTPS Git 推送密码；可通过 Git Credential Manager 的浏览器登录，或按官方说明配置令牌。\n\norigin 是远程仓库的习惯名称，main 是分支名。首次使用 -u 建立对应关系，以后在这个分支直接 git push 即可。\n\n 把仓库变成网站\n\n本项目已经包含生成后的网页。进入仓库的 Settings → Pages，选择 Deploy from a branch，再选 main 和 / (root)，保存。\n\n对于 GitHub Free，使用公开仓库可以启用 Pages。查看 Actions 中的发布进度，成功后以 Pages 页面显示的网址为准。若使用 personal-site 这个仓库名，通常对应 https://williamtymhuabian.github.io/personal-site/。\n\n如果希望网址直接是 https://williamtymhuabian.github.io/，则创建同名仓库 williamtymhuabian.github.io，并相应修改远程地址。\n\n 以后更新只重复这几步\n\n编辑 profile.json 或 content 中的 Markdown 文件后：\n\npowershell\nnode build.mjs\ngit status\ngit add .\ngit commit -m \"Update notes\"\ngit push\n\n\nnode build.mjs 把文章改动写入网页，git push 把新版本发送到 GitHub。Pages 开启后会根据新的推送再次发布。\n\n如果提示没有新内容可以提交，先用 git status 检查是否确实修改并保存了文件。如果提示远程已有更新，先查看双方差异；不要用强制推送覆盖不明来源的提交。\n\n 参考资料\n\n- [GitHub 官方：添加本地代码到 GitHub](https://docs.github.com/en/migrations/importing-source-code/using-the-command-line-to-import-source-code/adding-locally-hosted-code-to-github)\n- [GitHub 官方：配置 Pages 发布来源](https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site)\n- [GitHub 官方：身份验证方式](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github)\n","html":"\u003cp>Git 负责记录本地版本，GitHub 用来保存远程仓库，GitHub Pages 则负责把仓库中的网页发布出来。完成一次发布，需要依次走过这三个环节。\u003c/p>\n\u003cp>这是一篇随网站附带的入门手记。仓库名、邮箱等示例需要替换成自己的信息；下面的命令没有自动执行。\u003c/p>\n\u003ch2 id=\"section-1\">先在本地生成网页\u003c/h2>\n\u003cp>打开 PowerShell，进入这个项目文件夹，生成网页：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Set-Location -LiteralPath &#39;C:\\Users\\ASUS\\Desktop\\自媒体\\personal-site&#39;\nnode build.mjs\u003c/code>\u003c/pre>\n\u003cp>生成后的 \u003ccode>index.html\u003c/code> 可以直接双击打开。需要本地预览地址时，执行 \u003ccode>node build.mjs --serve\u003c/code>，再访问终端打印的地址。\u003c/p>\n\u003ch2 id=\"section-2\">建立本地版本记录\u003c/h2>\n\u003cp>确认当前目录就是 personal-site。对于这个尚未初始化的新项目，依次执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">git init -b main\ngit config user.name &quot;Williamtym&quot;\ngit config user.email &quot;替换成你的 GitHub 提交邮箱&quot;\ngit status\ngit add .\ngit commit -m &quot;Create personal website&quot;\u003c/code>\u003c/pre>\n\u003cp>邮箱可以在 GitHub 的 Settings → Emails 中查看，也可以使用那里提供的 noreply 邮箱。这里的 \u003ccode>git config\u003c/code> 只设置当前仓库。\u003c/p>\n\u003cp>\u003ccode>git add\u003c/code> 选择准备记录的修改，\u003ccode>git commit\u003c/code> 在本地保存一次版本。完成 commit 后，文件仍然只在本地。\u003c/p>\n\u003ch2 id=\"section-3\">连接 GitHub 仓库并推送\u003c/h2>\n\u003cp>在 GitHub 创建一个名为 \u003ccode>personal-site\u003c/code> 的空仓库。不要勾选自动添加 README、.gitignore 或 License，因为本地已经有文件。\u003c/p>\n\u003cp>然后连接远程仓库，并推送 main 分支：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">git remote add origin https://github.com/williamtymhuabian/personal-site.git\ngit remote -v\ngit push -u origin main\u003c/code>\u003c/pre>\n\u003cp>这里的远程地址以仓库名 personal-site 为例；如果使用其他名字，请换成新仓库页面显示的 HTTPS 地址。第一次连接时按 Git 的登录提示完成授权。GitHub 账号密码不能作为 HTTPS Git 推送密码；可通过 Git Credential Manager 的浏览器登录，或按官方说明配置令牌。\u003c/p>\n\u003cp>\u003ccode>origin\u003c/code> 是远程仓库的习惯名称，\u003ccode>main\u003c/code> 是分支名。首次使用 \u003ccode>-u\u003c/code> 建立对应关系，以后在这个分支直接 \u003ccode>git push\u003c/code> 即可。\u003c/p>\n\u003ch2 id=\"section-4\">把仓库变成网站\u003c/h2>\n\u003cp>本项目已经包含生成后的网页。进入仓库的 Settings → Pages，选择 Deploy from a branch，再选 \u003ccode>main\u003c/code> 和 \u003ccode>/ (root)\u003c/code>，保存。\u003c/p>\n\u003cp>对于 GitHub Free，使用公开仓库可以启用 Pages。查看 Actions 中的发布进度，成功后以 Pages 页面显示的网址为准。若使用 personal-site 这个仓库名，通常对应 \u003ccode>https://williamtymhuabian.github.io/personal-site/\u003c/code>。\u003c/p>\n\u003cp>如果希望网址直接是 \u003ccode>https://williamtymhuabian.github.io/\u003c/code>，则创建同名仓库 \u003ccode>williamtymhuabian.github.io\u003c/code>，并相应修改远程地址。\u003c/p>\n\u003ch2 id=\"section-5\">以后更新只重复这几步\u003c/h2>\n\u003cp>编辑 \u003ccode>profile.json\u003c/code> 或 \u003ccode>content\u003c/code> 中的 Markdown 文件后：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">node build.mjs\ngit status\ngit add .\ngit commit -m &quot;Update notes&quot;\ngit push\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>node build.mjs\u003c/code> 把文章改动写入网页，\u003ccode>git push\u003c/code> 把新版本发送到 GitHub。Pages 开启后会根据新的推送再次发布。\u003c/p>\n\u003cp>如果提示没有新内容可以提交，先用 \u003ccode>git status\u003c/code> 检查是否确实修改并保存了文件。如果提示远程已有更新，先查看双方差异；不要用强制推送覆盖不明来源的提交。\u003c/p>\n\u003ch2 id=\"section-6\">参考资料\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://docs.github.com/en/migrations/importing-source-code/using-the-command-line-to-import-source-code/adding-locally-hosted-code-to-github\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 官方：添加本地代码到 GitHub\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 官方：配置 Pages 发布来源\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 官方：身份验证方式\u003c/a>\u003c/li>\n\u003c/ul>","headings":[{"id":"section-1","text":"先在本地生成网页"},{"id":"section-2","text":"建立本地版本记录"},{"id":"section-3","text":"连接 GitHub 仓库并推送"},{"id":"section-4","text":"把仓库变成网站"},{"id":"section-5","text":"以后更新只重复这几步"},{"id":"section-6","text":"参考资料"}]},{"slug":"binary-search","title":"写一个小实验：把二分查找的边界看清楚","date":"2026-10-16","category":"技术实践","summary":"用一个有序数组和一段短代码，观察区间如何缩小。先约定边界，再理解每一步为什么成立。","tags":["算法","C++","小实验"],"pinned":false,"readTime":3,"searchText":"\n二分查找的代码很短，但边界很容易写乱。与其记住一份模板，不如选定一种区间约定，再用一个小实验检查它。\n\n下面是开站时附带的算法示例笔记，可以继续补充自己的测试与理解。\n\n 先说明我们要找什么\n\n给定一个非递减排列的数组，找到第一个大于等于目标值的位置。如果不存在，就返回数组长度。\n\n这个定义可以同时处理重复元素和找不到目标的情况。例如，在 [1, 3, 3, 7, 9] 中查找 3，答案是下标 1；查找 4，答案是下标 3；查找 10，答案是 5。\n\n 始终使用左闭右开的区间\n\n将还没有检查完的区间记为 [left, right)。开始时 left = 0，right = a.size()。\n\n- 如果中间元素小于目标值，那么它和它左边的元素都不可能是答案。\n- 否则，中间元素有可能是答案，继续检查更靠左的位置。\n- 当左右边界相遇时，剩余区间为空，当前位置就是答案。\n\ncpp\ninclude \u003ccassert\ninclude \u003cvector\n\nstd::size_t first_not_less(const std::vector\u003cint& a, int target) {\n    std::size_t left = 0;\n    std::size_t right = a.size();\n    while (left \u003c right) {\n        const auto mid = left + (right - left) / 2;\n        if (a[mid] \u003c target) {\n            left = mid + 1;\n        } else {\n            right = mid;\n        }\n    }\n    return left;\n}\n\nint main() {\n    const std::vector\u003cint a{1, 3, 3, 7, 9};\n    assert(first_not_less(a, 3) == 1);\n    assert(first_not_less(a, 4) == 3);\n    assert(first_not_less(a, 10) == 5);\n    assert(first_not_less({}, 3) == 0);\n}\n\n\n 观察过程，比只看结果多一步\n\n可以在循环中打印 left、mid 和 right，分别输入小于最小元素、恰好相等、落在两个元素之间和大于最大元素的目标值。\n\n观察时问自己：这一步排除了哪些位置？留下的位置为什么仍然包含我们要找的边界？数组有序是这个过程成立的前提。\n\n 给实验补上自己的理解\n\n可以继续比较 std::lower_bound 的结果，或把需求改为“第一个严格大于目标值的位置”。不要同时改变区间约定和查找目标：一次只改一件事，更容易发现边界变化的原因。\n","html":"\u003cp>二分查找的代码很短，但边界很容易写乱。与其记住一份模板，不如选定一种区间约定，再用一个小实验检查它。\u003c/p>\n\u003cp>下面是开站时附带的算法示例笔记，可以继续补充自己的测试与理解。\u003c/p>\n\u003ch2 id=\"section-1\">先说明我们要找什么\u003c/h2>\n\u003cp>给定一个非递减排列的数组，找到第一个大于等于目标值的位置。如果不存在，就返回数组长度。\u003c/p>\n\u003cp>这个定义可以同时处理重复元素和找不到目标的情况。例如，在 \u003ccode>[1, 3, 3, 7, 9]\u003c/code> 中查找 3，答案是下标 1；查找 4，答案是下标 3；查找 10，答案是 5。\u003c/p>\n\u003ch2 id=\"section-2\">始终使用左闭右开的区间\u003c/h2>\n\u003cp>将还没有检查完的区间记为 \u003ccode>[left, right)\u003c/code>。开始时 \u003ccode>left = 0\u003c/code>，\u003ccode>right = a.size()\u003c/code>。\u003c/p>\n\u003cul>\n\u003cli>如果中间元素小于目标值，那么它和它左边的元素都不可能是答案。\u003c/li>\n\u003cli>否则，中间元素有可能是答案，继续检查更靠左的位置。\u003c/li>\n\u003cli>当左右边界相遇时，剩余区间为空，当前位置就是答案。\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-cpp\">#include &lt;cassert&gt;\n#include &lt;vector&gt;\n\nstd::size_t first_not_less(const std::vector&lt;int&gt;&amp; a, int target) {\n    std::size_t left = 0;\n    std::size_t right = a.size();\n    while (left &lt; right) {\n        const auto mid = left + (right - left) / 2;\n        if (a[mid] &lt; target) {\n            left = mid + 1;\n        } else {\n            right = mid;\n        }\n    }\n    return left;\n}\n\nint main() {\n    const std::vector&lt;int&gt; a{1, 3, 3, 7, 9};\n    assert(first_not_less(a, 3) == 1);\n    assert(first_not_less(a, 4) == 3);\n    assert(first_not_less(a, 10) == 5);\n    assert(first_not_less({}, 3) == 0);\n}\u003c/code>\u003c/pre>\n\u003ch2 id=\"section-3\">观察过程，比只看结果多一步\u003c/h2>\n\u003cp>可以在循环中打印 \u003ccode>left\u003c/code>、\u003ccode>mid\u003c/code> 和 \u003ccode>right\u003c/code>，分别输入小于最小元素、恰好相等、落在两个元素之间和大于最大元素的目标值。\u003c/p>\n\u003cp>观察时问自己：这一步排除了哪些位置？留下的位置为什么仍然包含我们要找的边界？数组有序是这个过程成立的前提。\u003c/p>\n\u003ch2 id=\"section-4\">给实验补上自己的理解\u003c/h2>\n\u003cp>可以继续比较 \u003ccode>std::lower_bound\u003c/code> 的结果，或把需求改为“第一个严格大于目标值的位置”。不要同时改变区间约定和查找目标：一次只改一件事，更容易发现边界变化的原因。\u003c/p>","headings":[{"id":"section-1","text":"先说明我们要找什么"},{"id":"section-2","text":"始终使用左闭右开的区间"},{"id":"section-3","text":"观察过程，比只看结果多一步"},{"id":"section-4","text":"给实验补上自己的理解"}]},{"slug":"hello-world","title":"开一个小站，给探索留一个位置","date":"2026-10-16","category":"随记","summary":"从今天起，把技术实践、算法思考和历史阅读放进同一本手记。一次记录一点，慢慢积累。","tags":["开站","学习","记录"],"pinned":false,"readTime":1,"searchText":"\n你好，我是 Williamtym，一名计算机科学与技术专业的硕士研究生。\n\n我对新技术感兴趣，也喜欢历史。开始这个网站，是想给自己的学习和探索找一个固定的地方，并试着在表达中发现自己还能做什么。\n\n 这里准备记录什么\n\n- 技术实践： 从一个具体问题出发，记录尝试、结果和仍然存在的限制。\n- 算法思考： 把概念、例子和代码放在一起，慢慢把问题讲清楚。\n- 历史阅读： 从感兴趣的小问题开始，重视出处，也保留疑问。\n- 学习随记： 留下阶段性的想法，方便以后回头看看。\n\n 先做一件小事\n\n每周能投入的时间有限，所以希望从一篇范围明确的内容开始。把一个问题讲完整，比同时开很多题目更适合作为起点。\n\n不必等到所有事情都想明白再动笔。重要的是把已知的依据说明白，把还不确定的地方标出来，并在新的实践中继续修正。\n\n 把不同地方连接起来\n\nGitHub 用来保存代码，CSDN 用来分享技术文章。这个网站则作为个人入口，慢慢整理文章、作品与经历。\n\n保持好奇，认真求证。希望下一次回来时，这里又多了一点值得留下的东西。\n","html":"\u003cp>你好，我是 Williamtym，一名计算机科学与技术专业的硕士研究生。\u003c/p>\n\u003cp>我对新技术感兴趣，也喜欢历史。开始这个网站，是想给自己的学习和探索找一个固定的地方，并试着在表达中发现自己还能做什么。\u003c/p>\n\u003ch2 id=\"section-1\">这里准备记录什么\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>技术实践：\u003c/strong> 从一个具体问题出发，记录尝试、结果和仍然存在的限制。\u003c/li>\n\u003cli>\u003cstrong>算法思考：\u003c/strong> 把概念、例子和代码放在一起，慢慢把问题讲清楚。\u003c/li>\n\u003cli>\u003cstrong>历史阅读：\u003c/strong> 从感兴趣的小问题开始，重视出处，也保留疑问。\u003c/li>\n\u003cli>\u003cstrong>学习随记：\u003c/strong> 留下阶段性的想法，方便以后回头看看。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-2\">先做一件小事\u003c/h2>\n\u003cp>每周能投入的时间有限，所以希望从一篇范围明确的内容开始。把一个问题讲完整，比同时开很多题目更适合作为起点。\u003c/p>\n\u003cp>不必等到所有事情都想明白再动笔。重要的是把已知的依据说明白，把还不确定的地方标出来，并在新的实践中继续修正。\u003c/p>\n\u003ch2 id=\"section-3\">把不同地方连接起来\u003c/h2>\n\u003cp>GitHub 用来保存代码，CSDN 用来分享技术文章。这个网站则作为个人入口，慢慢整理文章、作品与经历。\u003c/p>\n\u003cp>保持好奇，认真求证。希望下一次回来时，这里又多了一点值得留下的东西。\u003c/p>","headings":[{"id":"section-1","text":"这里准备记录什么"},{"id":"section-2","text":"先做一件小事"},{"id":"section-3","text":"把不同地方连接起来"}]},{"slug":"reading-history","title":"读历史时，先把事实与解释分开","date":"2026-10-16","category":"历史阅读","summary":"留下一个阅读习惯：看见一个有趣的说法时，先追问它来自哪里，再判断它能解释多少事情。","tags":["历史","阅读方法","笔记"],"pinned":false,"readTime":1,"searchText":"\n历史的吸引力，不只在于发生过什么，也在于同一件事为什么会被不同的人讲成不同的故事。\n\n这篇开站示例笔记先记下一种阅读方式。以后可以围绕具体书目和史料，把问题继续展开。\n\n 把笔记分成三层\n\n- 材料说了什么： 记录出处、原文位置和大致语境。\n- 作者怎样解释： 标记推断、因果判断和价值评价。\n- 我还有什么疑问： 写下暂时没有证据回答的问题。\n\n把三层分开，能帮助自己在重读时知道：哪些是材料提供的信息，哪些是作者的理解，哪些仍然只是自己的猜想。\n\n 遇到很顺的故事，多问一个问题\n\n一段叙事如果把复杂事件解释得非常顺畅，可以先问：它忽略了哪些人、哪些条件、哪些相反的材料？\n\n这并不意味着生动的表达一定不可靠，而是提醒自己，表达的感染力与证据的充分程度，需要分别判断。\n\n 让一次阅读留下一个可追问的问题\n\n与其急着写一个大结论，不如先留下一个小问题：某个说法最早出现在哪里？不同作者是否使用了同一份材料？翻译和转述有没有改变原意？\n\n等到资料足够，再把这个小问题整理成一篇有出处、边界清楚的文章。暂时不知道的地方，也值得诚实记下来。\n","html":"\u003cp>历史的吸引力，不只在于发生过什么，也在于同一件事为什么会被不同的人讲成不同的故事。\u003c/p>\n\u003cp>这篇开站示例笔记先记下一种阅读方式。以后可以围绕具体书目和史料，把问题继续展开。\u003c/p>\n\u003ch2 id=\"section-1\">把笔记分成三层\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>材料说了什么：\u003c/strong> 记录出处、原文位置和大致语境。\u003c/li>\n\u003cli>\u003cstrong>作者怎样解释：\u003c/strong> 标记推断、因果判断和价值评价。\u003c/li>\n\u003cli>\u003cstrong>我还有什么疑问：\u003c/strong> 写下暂时没有证据回答的问题。\u003c/li>\n\u003c/ul>\n\u003cp>把三层分开，能帮助自己在重读时知道：哪些是材料提供的信息，哪些是作者的理解，哪些仍然只是自己的猜想。\u003c/p>\n\u003ch2 id=\"section-2\">遇到很顺的故事，多问一个问题\u003c/h2>\n\u003cp>一段叙事如果把复杂事件解释得非常顺畅，可以先问：它忽略了哪些人、哪些条件、哪些相反的材料？\u003c/p>\n\u003cp>这并不意味着生动的表达一定不可靠，而是提醒自己，表达的感染力与证据的充分程度，需要分别判断。\u003c/p>\n\u003ch2 id=\"section-3\">让一次阅读留下一个可追问的问题\u003c/h2>\n\u003cp>与其急着写一个大结论，不如先留下一个小问题：某个说法最早出现在哪里？不同作者是否使用了同一份材料？翻译和转述有没有改变原意？\u003c/p>\n\u003cp>等到资料足够，再把这个小问题整理成一篇有出处、边界清楚的文章。暂时不知道的地方，也值得诚实记下来。\u003c/p>","headings":[{"id":"section-1","text":"把笔记分成三层"},{"id":"section-2","text":"遇到很顺的故事，多问一个问题"},{"id":"section-3","text":"让一次阅读留下一个可追问的问题"}]}]}</script>
