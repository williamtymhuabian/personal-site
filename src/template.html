<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#f8f7f3">
  <title>{{TITLE}}</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('william-theme')||'light'}catch(e){}</script>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="./assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="site-shell">
    <aside class="sidebar" aria-label="网站侧栏">
      <a class="brand" href="#/" aria-label="{{NAME}} 首页"><span class="brand-mark">w<span>.</span></span><span class="brand-word">{{NAME}}<small>探索手记 / FIELD NOTES</small></span></a>
      <button class="mobile-menu icon-button" id="menu-toggle" aria-label="展开导航" aria-expanded="false"></button>
      <div class="sidebar-body" id="sidebar-body">
        <div class="profile-block"><div class="avatar" aria-hidden="true">W<span>_</span></div><p class="profile-name">{{NAME}}</p><p class="profile-role">{{ROLE}}</p><span class="profile-status"><i></i> 学习中，也记录中</span></div>
        <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>
        <div class="sidebar-bottom"><p class="tiny-label">ELSEWHERE / 在别处</p><div id="sidebar-socials" class="sidebar-socials"></div><p class="sidebar-motto">{{MOTTO}}<br><span>One small discovery at a time.</span></p></div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb"><span>{{NAME}}</span><span class="breadcrumb-slash">/</span><span id="page-label">首页</span></div><div class="topbar-actions"><button class="search-trigger" id="search-open" aria-label="搜索文章"><span id="search-symbol"></span><span>搜索手记</span><kbd>Ctrl K</kbd></button><button class="icon-button" id="theme-toggle" aria-label="切换到深色主题"></button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="site-footer"><span>© <span id="copyright-year"></span> {{NAME}}<span class="footer-dot">·</span>保持好奇，持续记录</span><a href="#/about">关于这片小天地 <span aria-hidden="true">↗</span></a></footer>
    </div>
  </div>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title"><div class="search-dialog-head"><h2 id="search-title">搜索手记</h2><button class="icon-button dialog-close" aria-label="关闭搜索"></button></div><label class="sr-only" for="search-input">输入标题、关键词或标签</label><input id="search-input" type="search" placeholder="试试 Git、算法、历史……" autocomplete="off"><div id="search-results" aria-live="polite"></div><p class="search-hint">输入关键词搜索所有文章<span><kbd>Esc</kbd> 关闭</span></p></dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div class="search-dialog-head"><span class="tiny-label">AWARD NOTE / 获奖记录</span><button class="icon-button dialog-close" aria-label="关闭详情"></button></div><h2 id="detail-title"></h2><p id="detail-body"></p><p class="detail-footnote">页面展示奖项摘要，未上传证书原件。</p></dialog>
  <div id="toast" role="status" class="toast"></div>
  <noscript><div class="noscript-note">{{NAME}} 的探索手记：计算机科学与技术硕士研究生，记录算法、技术实践与历史阅读。请开启 JavaScript 浏览文章、项目与获奖经历。</div></noscript>
  <script id="site-data" type="application/json">{{SITE_DATA}}</script>
</body>
</html>
